packages:
  "framer-motion": "For buttery smooth page transitions and interactive elements"
  "react-hook-form": "For robust form state management"
  "@hookform/resolvers": "Zod integration for react-hook-form"
  "zod": "Schema validation for forms"
  "date-fns": "For formatting dates nicely"
  "canvas-confetti": "For celebration effects on successful pass purchase"

images:
  - path: "artifacts/viralstore/public/images/hero-bg.png"
    description: "Dark premium modern abstract background with neon purple and cyan glowing mesh gradients, very sleek"
    aspect_ratio: "16:9"
  - path: "artifacts/viralstore/public/images/avatar-placeholder.png"
    description: "Sleek modern 3D abstract avatar with glowing neon edges on a dark background"
    aspect_ratio: "1:1"
  - path: "artifacts/viralstore/public/images/ai-coach.png"
    description: "Futuristic friendly robot face icon with glowing purple and cyan neon accents, dark background"
    aspect_ratio: "1:1"

notes:
  - Custom fetch interceptor is implemented in App.tsx to automatically append the JWT from localStorage to all /api requests.
  - Cloudinary upload widget script is dynamically injected when the upload component mounts.
  - SSE Streaming for AI chat is manually implemented in the hooks to bypass Orval's limitation.
